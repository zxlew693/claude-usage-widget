<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Claude Usage Widget logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2A32"/>
      <stop offset="1" stop-color="#141418"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5FB49C"/>
      <stop offset="0.55" stop-color="#E5B567"/>
      <stop offset="1" stop-color="#D97757"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="54.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"/>

  <!-- Gauge track: 270° arc, open at the bottom -->
  <path d="M72.85 183.15 A78 78 0 1 1 183.15 183.15" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="26" stroke-linecap="round"/>

  <!-- Usage: ~68% of the gauge -->
  <path d="M72.85 183.15 A78 78 0 1 1 186.87 76.82" fill="none" stroke="url(#fill)" stroke-width="26" stroke-linecap="round"/>

  <!-- Hub -->
  <circle cx="128" cy="128" r="17" fill="#D97757"/>
</svg>
